name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge_noti_app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/challenge_noti_app_test

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Setup DB
        run: bin/rails db:create db:migrate
      - name: RSpec
        run: bundle exec rspec --format progress
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p badges
          PCT=$(ruby -r json -e "puts JSON.parse(File.read('coverage/.last_run.json'))['result']['line'].round")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellowgreen"
          elif [ "$PCT" -ge 60 ]; then COLOR="yellow"
          else                         COLOR="red"
          fi
          curl -fsSL "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}.svg" \
            -o badges/coverage.svg
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update coverage badge [skip ci]"
            git push
          fi
