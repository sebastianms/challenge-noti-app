services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: challenge_noti_app_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/challenge_noti_app_development
      DATABASE_URL_TEST: postgres://postgres:postgres@db:5432/challenge_noti_app_test
      ALLOW_LOAD_TEST_INGEST: ${ALLOW_LOAD_TEST_INGEST:-0}
      LOAD_TEST_BASIC_AUTH_USER: ${LOAD_TEST_BASIC_AUTH_USER:-}
      LOAD_TEST_BASIC_AUTH_PASSWORD: ${LOAD_TEST_BASIC_AUTH_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/challenge_noti_app_development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: ["bin/rails", "worker:run[10,2]"]
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL_TEST: postgres://postgres:postgres@db:5432/challenge_noti_app_test
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    command: ["bundle", "exec", "rspec"]

  k6:
    image: grafana/k6
    profiles:
      - load-test
    depends_on:
      - app
    environment:
      BASE_URL: http://app:3000
    volumes:
      - ./specs/009-observability-perf-hardening/load:/scripts
      - ./specs/009-observability-perf-hardening/reports:/reports
    command: ["run", "--out", "json=/reports/out.json", "/scripts/scenario.js"]

volumes:
  postgres_data:
  bundle_cache:
